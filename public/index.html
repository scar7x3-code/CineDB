<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineDB — Movie & Series Catalog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="" id="site-favicon" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ── Header ─────────────────────────────────────────── -->
  <header class="header">
    <a href="/" class="logo-link" aria-label="CineDB — Home">
      <canvas class="logo-popcorn" width="48" height="48" aria-hidden="true"></canvas>
      <span class="logo">CINE<span>DB</span></span>
    </a>

    <div class="search-wrapper">
      <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="Search movies, series..."
        autocomplete="off"
        spellcheck="false"
      />
      <button class="search-btn" id="searchBtn" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
      <ul class="suggestions" id="suggestions" hidden></ul>
    </div>
  </header>

  <!-- ── Main ───────────────────────────────────────────── -->
  <main class="main">

    <!-- Filters -->
    <div class="filters" role="group" aria-label="Catalog sections">
      <button type="button" class="filter-btn active" data-type="">Trending</button>
      <button type="button" class="filter-btn" data-type="movie">Movies</button>
      <button type="button" class="filter-btn" data-type="series">Series</button>
    </div>

    <p class="catalog-sub">Search any title, or use the tabs—your picks load in a snap.</p>

    <!-- Status / heading -->
    <p class="catalog-heading" id="catalogHeading"></p>

    <!-- Grid -->
    <div class="grid" id="grid"></div>

    <!-- Skeleton loader -->
    <div class="grid skeleton-grid" id="skeletonGrid">
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </div>

    <!-- Empty state -->
    <div class="empty-state" id="emptyState" hidden>
      <span class="empty-icon" aria-hidden="true">🍿</span>
      <p>Nothing turned up</p>
      <small>Try another spelling, a shorter word, or switch tabs!</small>
    </div>

    <!-- Pagination -->
    <div class="pagination" id="pagination" hidden>
      <button class="page-btn" id="prevBtn" disabled>← Prev</button>
      <span class="page-info" id="pageInfo"></span>
      <button class="page-btn" id="nextBtn">Next →</button>
    </div>
  </main>



  <script src="js/escape.js"></script>
  <script src="js/logo-canvas.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
