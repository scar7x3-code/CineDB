<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineDB — Loading...</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="" id="site-favicon" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="detail-body">

  <!-- ── Header ─────────────────────────────────────────── -->
  <header class="header">
    <a href="/" class="logo-link" aria-label="CineDB — Home">
      <canvas class="logo-popcorn" width="48" height="48" aria-hidden="true"></canvas>
      <span class="logo">CINE<span>DB</span></span>
    </a>
    <div class="search-wrapper">
      <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="Search movies, series..."
        autocomplete="off"
        spellcheck="false"
      />
      <button class="search-btn" id="searchBtn" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
      <ul class="suggestions" id="suggestions" hidden></ul>
    </div>
  </header>

  <!-- ── Detail ─────────────────────────────────────────── -->
  <main class="detail-main" id="detailMain">

    <!-- Loading -->
    <div class="detail-loading" id="detailLoading">
      <div class="spinner"></div>
    </div>

    <!-- Error -->
    <div class="detail-error" id="detailError" hidden>
      <p>Could not load this title.</p>
      <a href="/" class="btn-back">← Back to catalog</a>
    </div>

    <!-- Content (injected by JS) -->
    <div id="detailContent" hidden></div>

  </main>

  <!-- ── Chat assistant ─────────────────────────────────── -->
  <div class="chat-widget" id="chatWidget">
    <button
      type="button"
      class="chat-toggle"
      id="chatToggle"
      aria-label="Abrir asistente de recomendaciones"
      aria-expanded="false"
      aria-controls="chatPanel"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
    </button>

    <section class="chat-panel" id="chatPanel" hidden aria-label="Asistente de recomendaciones">
      <header class="chat-header">
        <div>
          <p class="chat-title">Recomendaciones</p>
          <p class="chat-sub">Películas y series</p>
        </div>
        <button type="button" class="chat-close" id="chatClose" aria-label="Cerrar chat">×</button>
      </header>

      <div class="chat-messages" id="chatMessages" role="log" aria-live="polite" aria-relevant="additions"></div>

      <form class="chat-form" id="chatForm">
        <textarea
          id="chatInput"
          class="chat-input"
          rows="1"
          placeholder="¿Qué quieres ver?"
          maxlength="800"
          autocomplete="off"
        ></textarea>
        <button type="submit" class="chat-send" id="chatSend" aria-label="Enviar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </form>
    </section>
  </div>

  <script src="js/escape.js"></script>
  <script src="js/logo-canvas.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/movie.js"></script>
</body>
</html>
